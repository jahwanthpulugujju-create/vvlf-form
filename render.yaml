services:
  - type: web
    name: vvlf-form
    env: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GOOGLE_SHEET_WEBHOOK_URL
        value: "https://script.google.com/macros/s/AKfycbz94rbvo1Lg83JM2gdLBOKoIf9pfhcaNH9fWHp4WD8v_8YmEWix4-hZr9jXZSZY5VJy/exec"
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_APP_ID
        value: vvlf-form
      - key: OWNER_OPEN_ID
        value: admin
      - key: OWNER_NAME
        value: Admin
